{% if page.zh_url %}<link rel="alternate" hreflang="zh-CN" href="{{ page.zh_url | absolute_url }}">{% endif %}
{% if page.en_url %}<link rel="alternate" hreflang="en" href="{{ page.en_url | absolute_url }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="blog-home" content="{{ page.home_url | default: '/' | relative_url }}">
<script src="{{ '/assets/js/language.js' | relative_url }}" defer></script>
