<nav class="language-switch" aria-label="{{ t.language_label }}">
    <a href="{{ page.zh_url | default: '/' | relative_url }}" lang="zh-CN" hreflang="zh-CN" data-language="zh-CN"{% if language == 'zh-CN' %} aria-current="true"{% endif %} title="切换为中文">中</a>
    {% if page.en_url %}
    <a href="{{ page.en_url | relative_url }}" lang="en" hreflang="en" data-language="en"{% if language == 'en' %} aria-current="true"{% endif %} title="Read in English">EN</a>
    {% else %}
    <span lang="en" aria-disabled="true" title="{{ t.translation_unavailable }}">EN</span>
    {% endif %}
</nav>
