    <meta name="referrer" content="origin" />

    <meta property="og:site_name" content="{{ t.site_name }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | default: t.site_name | escape }}" />
    <meta property="og:description" content="{{ t.site_description | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ site.baseurl }}assets/images/cover1.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | default: t.site_name | escape }}" />
    <meta name="twitter:description" content="{{ t.site_description | escape }}" />
    <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
    <meta name="twitter:image:src" content="{{ site.baseurl }}assets/images/cover1.jpg" />

    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | default: t.site_name | jsonify }},
    "inLanguage": {{ language | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "description": {{ t.site_description | jsonify }}
}
    </script>

    <meta name="generator" content="Jekyll {{ jekyll.version }}" />
    <link rel="alternate" type="application/rss+xml" title="{{ t.site_name }}" href="{{ page.home_url | default: '/' | append: 'feed.xml' | relative_url }}" />
